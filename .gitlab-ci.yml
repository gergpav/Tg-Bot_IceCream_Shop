stages:
  - build
build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.6.0-debug
    entrypoint: [""]
  before_script:
    - apk add --no-cache jq  # Установка утилиты для работы с JSON
  script:
    - mkdir -p /kaniko/.docker
    # Правильный формат конфига для Yandex CR
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"json_key\",\"password\":$(echo "$CI_REGISTRY_KEY" | jq -c .)}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY}/${CI_PROJECT_PATH}:${CI_COMMIT_SHORT_SHA}"
      --verbosity=debug